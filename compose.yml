services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    environment:
      - HERMES_DASHBOARD=false
    volumes:
      - './hermes:/opt/data'
    ports:
      - '127.0.0.1:8642:8642'
    command: gateway run
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '1G'
