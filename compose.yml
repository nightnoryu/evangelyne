services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.7
    container_name: hermes
    restart: unless-stopped
    environment:
      - HERMES_DASHBOARD=false
    volumes:
      - './hermes:/opt/data'
    command: gateway run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '1G'
