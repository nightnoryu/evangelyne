database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  backend: agent-browser
  inactivity_timeout: 120
  command_timeout: 60
  extension_control:
    enabled: false
  cloud_provider: local
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 100
skills:
  creation_nudge_interval: 15
curator:
  enabled: true
  stale_after_days: 14
approvals:
  destructive_slash_confirm: false
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: /opt/data/bin/tirith
  tirith_timeout: 5
  tirith_fail_open: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: true
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
session_reset:
  mode: idle
  idle_minutes: 180
group_sessions_per_user: true
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - cronjob
  - delegation
  - file
  - session_search
  - skills
  - terminal
  - todo
  - web
  telegram:
  - browser
  - clarify
  - code_execution
  - cronjob
  - delegation
  - file
  - kanban
  - session_search
  - skills
  - terminal
  - todo
  - web
mcp_servers:
  youtrack:
    url: https://youtrack.ispring.lan/mcp
    headers:
      Authorization: Bearer ${MCP_YOUTRACK_API_KEY}
    ssl_verify: false
    enabled: true
    tools:
      include:
      - get_issue_fields_schema
      - get_project
      - get_issue
      - get_issue_comments
      - link_issues
      - log_work
      - get_saved_issue_searches
      - get_user_group_members
      - find_user_groups
      - get_current_user
      - find_projects
      - find_user
      - search_issues
